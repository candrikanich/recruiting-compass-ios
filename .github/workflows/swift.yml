# This workflow will build an iOS Xcode project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Select iOS simulator
      id: simulator
      run: |
        echo "=== Available iPhone Simulators ==="
        xcrun simctl list devices available | grep "iPhone" || true
        LINE=$(xcrun simctl list devices available | grep "iPhone" | grep -v "Clone" | head -1)
        if [ -z "$LINE" ]; then
          echo "::error::No iPhone simulator found"
          exit 1
        fi
        DEVICE_ID=$(echo "$LINE" | grep -oE '\([0-9A-Fa-f-]{36}\)' | head -1 | tr -d '()')
        echo "device_id=$DEVICE_ID" >> $GITHUB_OUTPUT
        echo "Using device: $DEVICE_ID"

    - name: Boot simulator
      run: |
        xcrun simctl boot "${{ steps.simulator.outputs.device_id }}" || true
        sleep 5

    - name: Show available schemes
      working-directory: TheRecruitingCompass
      run: xcodebuild -list

    - name: Build
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        DESTINATION: platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}
      run: |
        xcodebuild build \
          -scheme TheRecruitingCompass \
          -destination "$DESTINATION"

    - name: Run tests
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        DESTINATION: platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}
      run: |
        xcodebuild test \
          -scheme TheRecruitingCompass \
          -destination "$DESTINATION" \
          -only-testing:TheRecruitingCompassTests
