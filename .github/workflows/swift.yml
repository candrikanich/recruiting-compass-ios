# Build and test iOS app.
# Workaround for runner simulator issues: https://github.com/actions/runner-images/issues/12777
name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    # Pin Xcode 16.4 and ensure iOS platform is available (fixes "No matching device" on newer images)
    - name: Set up Xcode 16.4
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "16.4"

    - name: Ensure iOS simulator platform
      run: |
        sudo xcodebuild -license accept || true
        sudo xcodebuild -downloadPlatform iOS || true
        xcrun simctl list devices available | grep -E "iPhone|iPad" | head -15 || true

    - name: Build and test
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        set -e
        echo "== Xcode =="
        xcodebuild -version
        echo ""
        echo "== Available iPhones =="
        xcrun simctl list devices available | grep " iPhone " | grep -v Clone || true
        echo ""
        for name in "iPhone 16" "iPhone 17" "iPhone 15" "iPhone SE (3rd generation)"; do
          if xcrun simctl list devices available | grep -q " $name "; then
            DEST="platform=iOS Simulator,name=$name,OS=latest"
            echo "Using destination: $DEST"
            xcodebuild build -scheme TheRecruitingCompass -destination "$DEST"
            xcodebuild test -scheme TheRecruitingCompass -destination "$DEST" -only-testing:TheRecruitingCompassTests
            exit 0
          fi
        done
        echo "::error::No supported iPhone simulator found. Available devices:"
        xcrun simctl list devices available
        exit 1
