# Build and test iOS app. Uses fixed destination (iPhone 16 on macos-latest).
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: List simulators
      run: xcrun simctl list devices available | grep -E "iPhone|iPad" | head -15 || true

    - name: Build
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        xcodebuild -version
        xcodebuild build \
          -scheme TheRecruitingCompass \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'

    - name: Run tests
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        xcodebuild test \
          -scheme TheRecruitingCompass \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
          -only-testing:TheRecruitingCompassTests
