# Build and test iOS app. Discovers simulator and runs build+test in one script.
name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build and test
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        set -e
        echo "== Xcode =="
        xcodebuild -version
        echo ""
        echo "== Available iPhones =="
        xcrun simctl list devices available | grep " iPhone " | grep -v Clone || true
        echo ""
        # Try fixed names first (order matters on different runner images)
        for name in "iPhone 16" "iPhone 17" "iPhone 15" "iPhone SE (3rd generation)"; do
          if xcrun simctl list devices available | grep -q " $name "; then
            DEST="platform=iOS Simulator,name=$name,OS=latest"
            echo "Using destination: $DEST"
            xcodebuild build -scheme TheRecruitingCompass -destination "$DEST"
            xcodebuild test -scheme TheRecruitingCompass -destination "$DEST" -only-testing:TheRecruitingCompassTests
            exit 0
          fi
        done
        echo "::error::No supported iPhone simulator found. Available devices:"
        xcrun simctl list devices available
        exit 1
