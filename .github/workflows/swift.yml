# This workflow will build an iOS Xcode project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: List simulators (diagnostics)
      run: |
        echo "=== Available iOS Simulators ==="
        xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20 || true

    - name: Show available schemes
      working-directory: TheRecruitingCompass
      run: xcodebuild -list

    - name: Build
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        xcodebuild build \
          -scheme TheRecruitingCompass \
          -destination 'generic/platform=iOS Simulator'

    - name: Run tests
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        xcodebuild test \
          -scheme TheRecruitingCompass \
          -destination 'generic/platform=iOS Simulator' \
          -only-testing:TheRecruitingCompassTests
