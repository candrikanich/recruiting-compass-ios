# This workflow will build an iOS Xcode project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Get simulator UDID
      id: sim
      run: |
        echo "=== Available iOS Simulators ==="
        xcrun simctl list devices available | grep -E "iPhone|iPad" | head -10 || true
        # Use jq to get first available iPhone UDID (reliable across Xcode versions)
        UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS")) | .value[] | select(.name | test("iPhone")) | .udid] | first' 2>/dev/null || true)
        if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
          echo "No available iPhones, trying full device list..."
          UDID=$(xcrun simctl list devices -j | jq -r '[.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS")) | .value[] | select(.name | test("iPhone")) | .udid] | first' 2>/dev/null || true)
        fi
        if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
          echo "::error::No iPhone simulator found"
          exit 1
        fi
        echo "udid=$UDID" >> $GITHUB_OUTPUT
        echo "Using simulator: $UDID"

    - name: Boot simulator
      run: |
        xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
        sleep 5

    - name: Show available schemes
      working-directory: TheRecruitingCompass
      run: xcodebuild -list

    - name: Build
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SIM_UDID: ${{ steps.sim.outputs.udid }}
      run: |
        xcodebuild build \
          -scheme TheRecruitingCompass \
          -destination "platform=iOS Simulator,id=$SIM_UDID"

    - name: Run tests
      working-directory: TheRecruitingCompass
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SIM_UDID: ${{ steps.sim.outputs.udid }}
      run: |
        xcodebuild test \
          -scheme TheRecruitingCompass \
          -destination "platform=iOS Simulator,id=$SIM_UDID" \
          -only-testing:TheRecruitingCompassTests
