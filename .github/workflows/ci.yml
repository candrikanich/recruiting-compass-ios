name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep 'iPhone 16' | grep -v 'Plus\|Pro' | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true

      - name: Create Release.xcconfig
        run: |
          # xcconfig treats // as a comment; URLs must use the _SLASH variable trick.
          # Unit tests use mocks so placeholder credentials are sufficient for CI builds.
          cat > TheRecruitingCompass/Release.xcconfig << 'XCCONFIG'
          _SLASH = /
          SUPABASE_URL = https:$(_SLASH)$(_SLASH)ci-placeholder.supabase.co
          SUPABASE_ANON_KEY = ci_placeholder_key
          API_BASE_URL = https:$(_SLASH)$(_SLASH)myrecruitingcompass.com
          XCCONFIG

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ hashFiles('TheRecruitingCompass/TheRecruitingCompass.xcodeproj/project.pbxproj') }}
          restore-keys: deriveddata-

      - name: Build
        run: |
          cd TheRecruitingCompass
          xcodebuild build \
            -scheme TheRecruitingCompass \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -quiet

      - name: Unit Tests
        run: |
          cd TheRecruitingCompass
          # CoreSimulator on the CI runner intermittently dies mid-run
          # ("(ipc/mig) server died"), which no in-process test retry can survive
          # because the whole test host is gone. Run the entire xcodebuild in a
          # retry loop, resetting the simulator stack between attempts. Parallel
          # test clones are disabled to reduce simulator churn (a common trigger).
          run_tests() {
            xcodebuild test \
              -scheme TheRecruitingCompass \
              -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
              -skip-testing:TheRecruitingCompassUITests \
              -parallel-testing-enabled NO \
              -retry-tests-on-failure -test-iterations 2 \
              -quiet
          }
          for attempt in 1 2; do
            echo "::group::Unit test attempt $attempt"
            if run_tests; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; resetting simulator stack before retry."
            xcrun simctl shutdown all || true
            killall -9 CoreSimulatorService || true
            sleep 5
          done
          echo "Unit tests failed after 2 full attempts."
          exit 1

  e2e-tests:
    name: E2E UITests
    runs-on: macos-15
    timeout-minutes: 60
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep 'iPhone 16' | grep -v 'Plus\|Pro' | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true

      - name: Create Release.xcconfig
        run: |
          cat > TheRecruitingCompass/Release.xcconfig << 'XCCONFIG'
          _SLASH = /
          SUPABASE_URL = https:$(_SLASH)$(_SLASH)ci-placeholder.supabase.co
          SUPABASE_ANON_KEY = ci_placeholder_key
          API_BASE_URL = https:$(_SLASH)$(_SLASH)myrecruitingcompass.com
          XCCONFIG

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install seed script dependencies
        run: cd scripts && npm ci

      - name: Seed E2E test data
        run: cd scripts && npm run seed:e2e
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-e2e-${{ hashFiles('TheRecruitingCompass/TheRecruitingCompass.xcodeproj/project.pbxproj') }}
          restore-keys: deriveddata-e2e-

      - name: Build for testing
        run: |
          cd TheRecruitingCompass
          xcodebuild build-for-testing \
            -scheme TheRecruitingCompass \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -quiet

      - name: Run UITests
        run: |
          cd TheRecruitingCompass
          xcodebuild test-without-building \
            -scheme TheRecruitingCompass \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -only-testing:TheRecruitingCompassUITests \
            -quiet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-e2e
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
