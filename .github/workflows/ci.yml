name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # E2E UITests don't run here: they need a Supabase stack, GitHub's macOS
  # runners have no Docker, and this repo is public, so they run nightly on
  # Chris's Mac via launchd instead — scripts/e2e/nightly-local.sh,
  # docs/E2E_TESTING.md. Lint + unit tests gate every PR.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip the macOS jobs. This is a job-level skip rather than
  # `paths-ignore` on purpose: the main ruleset requires "Build & Unit Tests",
  # and a workflow that never starts leaves that check pending forever, while a
  # skipped job reports as passed.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test path classifier
        run: scripts/ci/has-code-changes.test.sh

      - name: Classify changed paths
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A range git can't resolve (new branch, force-push) yields no paths,
          # which the classifier treats as code.
          code=$({ git diff --name-only "$BASE...$HEAD" 2>/dev/null || true; } | scripts/ci/has-code-changes.sh)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changes: $code" >> "$GITHUB_STEP_SUMMARY"

  # Public repo: a real Supabase/API value in a build-generated config file ships to
  # everyone. Same logic as the pre-commit hook (scripts/ci/check-generated-config.sh).
  generated-config-guard:
    name: Generated config guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test guard
        run: scripts/ci/check-generated-config.test.sh

      - name: Config files still match the committed stubs
        run: scripts/ci/check-generated-config.sh stub

      - name: Changed paths avoid generated config
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'allow-generated-config')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! hits=$(git diff --name-only "$BASE...$HEAD" | scripts/ci/check-generated-config.sh paths); then
            echo "::error::Build-generated config changed (label the PR allow-generated-config if intentional):"
            echo "$hits"
            exit 1
          fi

  lint:
    name: SwiftLint
    runs-on: macos-15
    needs: changes
    # Only an explicit "false" skips: if `changes` fails or is skipped, run.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7

      # Portable zip (~11MB) instead of brew (~30-60s) or realm/SwiftLint
      # (Docker action — Linux-only, so macos-15 fails immediately with
      # "Container action is only supported on Linux").
      - name: Install SwiftLint
        run: |
          curl -fsSL https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o /tmp/swiftlint.zip
          unzip -qo /tmp/swiftlint.zip -d /tmp/swiftlint
          echo "/tmp/swiftlint" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep 'iPhone 16' | grep -v 'Plus\|Pro' | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true

      - name: Create Release.xcconfig
        run: |
          # xcconfig treats // as a comment; URLs must use the _SLASH variable trick.
          # Unit tests use mocks so placeholder credentials are sufficient for CI builds.
          cat > TheRecruitingCompass/Release.xcconfig << 'XCCONFIG'
          _SLASH = /
          SUPABASE_URL = https:$(_SLASH)$(_SLASH)ci-placeholder.supabase.co
          SUPABASE_ANON_KEY = ci_placeholder_key
          API_BASE_URL = https:$(_SLASH)$(_SLASH)myrecruitingcompass.com
          XCCONFIG

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('TheRecruitingCompass/TheRecruitingCompass.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ hashFiles('TheRecruitingCompass/TheRecruitingCompass.xcodeproj/project.pbxproj', 'TheRecruitingCompass/TheRecruitingCompass.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: deriveddata-

      - name: Build for Testing
        run: |
          cd TheRecruitingCompass
          xcodebuild build-for-testing \
            -scheme TheRecruitingCompass \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -skip-testing:TheRecruitingCompassUITests \
            -showBuildTimingSummary

      - name: Unit Tests
        run: |
          cd TheRecruitingCompass
          # CoreSimulator on the CI runner intermittently dies mid-run
          # ("(ipc/mig) server died"), which no in-process test retry can survive
          # because the whole test host is gone. Run the entire xcodebuild in a
          # retry loop, resetting the simulator stack between attempts.
          run_tests() {
            rm -rf "TestResults-$1.xcresult"
            xcodebuild test-without-building \
              -scheme TheRecruitingCompass \
              -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
              -skip-testing:TheRecruitingCompassUITests \
              -parallel-testing-enabled YES \
              -maximum-concurrent-test-simulator-destinations 2 \
              -retry-tests-on-failure -test-iterations 2 \
              -enableCodeCoverage YES \
              -resultBundlePath "TestResults-$1.xcresult" \
              -quiet
          }
          for attempt in 1 2; do
            echo "::group::Unit test attempt $attempt"
            if run_tests "$attempt"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; resetting simulator stack before retry."
            xcrun simctl shutdown all || true
            killall -9 CoreSimulatorService || true
            sleep 5
          done
          echo "Unit tests failed after 2 full attempts."
          exit 1

      - name: Coverage Summary
        if: success()
        run: |
          RESULT=$(ls -td TheRecruitingCompass/TestResults-*.xcresult 2>/dev/null | head -1)
          if [ -n "$RESULT" ]; then
            echo "## Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            xcrun xccov view --report --only-targets "$RESULT" | head -30 >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload unit-test xcresult
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-unit
          path: TheRecruitingCompass/TestResults-*.xcresult
          retention-days: 7
