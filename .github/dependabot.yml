version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: swift
    directory: /TheRecruitingCompass
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # swift-clocks 1.1+ depends on swift-issue-reporting while supabase-swift still
      # depends on xctest-dynamic-overlay; both declare an IssueReporting target, so the
      # graph fails to resolve (Xcode Cloud build 83). Lift once supabase-swift migrates.
      - dependency-name: "github.com/pointfreeco/swift-clocks"
        versions: [">=1.1.0"]
      # Same conflict from the other side: xctest-dynamic-overlay 1.13.0 adds the
      # swift-issue-reporting dependency (#359). Lift together with swift-clocks.
      - dependency-name: "github.com/pointfreeco/xctest-dynamic-overlay"
        versions: [">=1.13.0"]
      # swift-crypto 5 fails strict package resolution (Xcode Cloud disables automatic
      # resolution, #357); take majors as a deliberate upgrade, not a Dependabot bump.
      - dependency-name: "github.com/apple/swift-crypto"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /e2e-api-tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
